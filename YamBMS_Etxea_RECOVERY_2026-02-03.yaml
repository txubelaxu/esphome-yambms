# RECOVERY CONFIG - reconstruye exactamente el estado de código que produjo
# el firmware que corría en producción en el ESP32-S3 (172.26.1.77) desde
# el 2026-02-03 hasta que se sustituya.
#
# Todos los paquetes apuntan al tag fijo `recovery-point-2026-02-03`
# (commit 7d3fa05 de txubelaxu/esphome-yambms) - NO a `dev` ni a `main`,
# que siguen moviéndose. Un tag de git no cambia nunca, así que este
# fichero seguirá siendo reconstruible exactamente igual dentro de meses
# o años, pase lo que pase en las ramas.
#
# Diferencia clave con YamBMS_Etxea.yaml: el fichero de placa se llama
# aquí `board_ESP32-S3_Freenove.yaml` (nombre antiguo) en vez de
# `board_ESP32-S3_freenove_esp32_s3_wroom.yaml` - ese renombrado ocurrió
# el 2026-02-09, seis días DESPUÉS de esta compilación.
#
# CORRECCIÓN AÑADIDA el 2026-08-18 (no estaba en el código original de esta
# fecha): mcp2515_clock: '16MHz' en el paquete board_options_itf_canbus_mcp2515.
# El conversor MCP2515 real lleva un cristal de 16MHz, pero el paquete asume
# 8MHz si no se sobreescribe. Sin este override el bitrate real del bus CAN
# sale duplicado y el Cerbo GX Victron no puede sincronizar - fallo total de
# comunicación con el inversor. Se descubrió y confirmó hoy en el candidato
# v1.7.1 y se retroaplica aquí porque es un bug de config, no de versión:
# lleva presente (sin corregir) en todo el histórico de esphome-yambms.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 172.26.1.77
    gateway: 172.26.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 8.8.4.4

logger:
  baud_rate: 115200
  level: INFO

ota:
  - platform: esphome

api:
  reboot_timeout: 0s

substitutions:
  friendly_name : 'YamBMS'
  hostname: 'yambms'
  name: ''
  yambms_id: 'yambms1'
  yambms_name: 'YamBMS 1'
  yambms_update_interval: '1s'
  yambms_input_number_mode: 'slider'
  yambms_battery_chemistry: '1' # 1-LFP | 2-Li-ion | 3-LTO
  yambms_cell_count: '16'
  yambms_bulk_v: '55.2'
  yambms_float_v: '53.6'
  yambms_rebulk_v: '52.8'
  yambms_eoc_timer: '30'
  yambms_cutoff_timer: '60'
  yambms_max_requested_charge_current: '300'
  yambms_max_requested_discharge_current: '300'
  yambms_charging_rate_table: |
    {
      { -0.1, 0.00 },
      {  0.0, 0.05 },
      {  5.0, 0.12 },
      { 10.0, 0.30 },
      { 20.0, 0.50 },
      { 25.0, 0.50 },
      { 45.0, 0.50 },
      { 50.0, 0.50 },
      { 55.0, 0.50 },
      { 60.0, 0.00 }
    }
  yambms_discharging_rate_table: |
    {
      {-30.0, 0.00 },
      {-20.0, 0.50 },
      {-10.0, 0.50 },
      { -5.0, 0.50 },
      {  0.0, 0.50 },
      {  5.0, 0.50 },
      { 45.0, 0.50 },
      { 50.0, 0.50 },
      { 55.0, 0.50 },
      { 60.0, 0.00 }
    }
  shunt_update_interval: '3s'
  bms_update_interval: '3s'
  canbus_clock: 16MHz

packages:

  board:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: recovery-point-2026-02-03
    refresh: 0min
    files:
      - path: 'packages/board/board_ESP32-S3_Freenove.yaml'   # <- nombre antiguo, ver cabecera

  board_options:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: recovery-point-2026-02-03
    refresh: 0min
    files:
      - path: 'packages/board/board_options_itf_uart_esp_1.yaml'
      - path: 'packages/board/board_options_itf_canbus_mcp2515.yaml'
        vars:
          canbus_node_id: 'canbus_inverter_1'
          mcp2515_clock: '16MHz'   # <-- AÑADIDO: el conversor físico lleva un cristal de 16MHz,
                                    #     pero el paquete asume 8MHz por defecto si no se sobreescribe.
                                    #     Confirmado el 2026-08-18 (misma causa raíz que en el
                                    #     candidato v1.7.1): sin este override, el bitrate real del
                                    #     bus sale duplicado y el Cerbo GX no puede sincronizar.

  bms:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: recovery-point-2026-02-03
    refresh: 0min
    files:
      - path: 'packages/bms/bms_combine_JK_RS485_Modbus_sniffer.yaml'
        vars:
          sniffer_protocol: 'JK02_32S'
          sniffer_uart_id: 'uart_esp_1'
      - path: 'packages/bms/bms_combine_JK_RS485_Modbus_bms_full.yaml'
        vars:
          bms_id: '1'
          bms_name: 'JK-BMS 1'
          bms_address: '0x01'
      - path: 'packages/bms/bms_combine_JK_RS485_Modbus_bms_full.yaml'
        vars:
          bms_id: '2'
          bms_name: 'JK-BMS 2'
          bms_address: '0x02'

  yambms:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: recovery-point-2026-02-03
    refresh: 0min
    files:
      - path: 'packages/yambms/yambms.yaml'

  canbus:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: recovery-point-2026-02-03
    refresh: 0min
    files:
      - path: 'packages/yambms/yambms_canbus.yaml'
        vars:
          canbus_id: 'canbus1'
          canbus_name: 'CANBUS 1'
          canbus_node_id: 'canbus_inverter_1'
          canbus_light_id: 'esp_light'
          canbus_link_timer: '5s'

  debug:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: recovery-point-2026-02-03
    refresh: 0min
    files:
      - path: packages/base/device_debug_ESP32.yaml
        vars:
          debug_name: 'Debug'
          debug_update_interval: '5s'
          debug_psram_size: '8388608'
