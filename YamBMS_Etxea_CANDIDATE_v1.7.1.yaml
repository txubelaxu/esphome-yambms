# CANDIDATO DE ACTUALIZACIÓN - EN PRODUCCIÓN desde 2026-08-18 en el ESP32-S3
# real (172.26.1.77). Basado en el tag fijo `update-candidate-2026-08-17`
# (YamBMS core, Sleeper85/esphome-yambms @ e183d20, justo antes de la
# reescritura a v1.8.0).
#
# Cambios respecto al que corría antes (YamBMS_Etxea_RECOVERY_2026-02-03.yaml):
#   - yambms_id: 'yambms1' -> '1'   (cambio de convención obligatorio desde el
#     28-jun-2026; si no se hace, TODAS las entidades sensor.yambms_yambms_1_*
#     que usa la automatización de PVPC en Home Assistant se romperían en
#     silencio - ver HA/README.txt)
#   - canbus_id: 'canbus1' -> '1'   (mismo cambio de convención, añadido con el
#     "Component Fault Registry" del 5-feb-2026 - PR #194: global_register_led()
#     y global_update_fault() esperan un entero de instancia, no el prefijo
#     completo. Sin este cambio la compilación falla con
#     "'canbus1' was not declared in this scope" en yambms_canbus.yaml)
#   - mcp2515_clock: '16MHz' añadido explícitamente (ver vars: en board_options
#     más abajo) - el conversor MCP2515 real lleva un cristal de 16MHz, pero el
#     paquete asume 8MHz si no se sobreescribe. Sin esto, el 100% de las tramas
#     CAN fallan sin ACK del inversor - causa raíz confirmada el 2026-08-18.
#   - Todos los paquetes actualizados el 2026-08-18 de `update-candidate-2026-08-10`
#     a `update-candidate-2026-08-17` (19 commits de Sleeper85/esphome-yambms,
#     17-jun a 17-ago-2026). Revisados uno a uno: la inmensa mayoría son
#     irrelevantes para esta instalación (soporte de pantallas que no usamos,
#     compliance de Modbus para BMS/shunt/balancer que no usamos - nuestro
#     JK-BMS va por sniffer UART). El único cambio funcional relevante:
#   - "Adjust Rebulk SoC if higher than target SoC" (29-jun-2026): con
#     `Auto SoC Limit Mode = Float` y `Rebulk SoC >= Auto SoC Limit`, el
#     sistema priorizaba mal el rebulk. Nuestros valores actuales (Rebulk
#     SoC 85% >= Auto SoC Limit 80%) caen justo en ese caso, aunque el switch
#     `Automatic SoC Limit` está en `off` así que no se dispara hoy. Si se
#     activa ese switch en el futuro, este fix ya estará aplicado.
#   - Nuevas opciones disponibles desde entonces: `loop_task_stack_size`
#     (dejada en su valor por defecto, 8192).

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 172.26.1.77
    gateway: 172.26.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 8.8.4.4

logger:
  baud_rate: 115200
  level: INFO

ota:
  - platform: esphome

api:
  reboot_timeout: 0s

substitutions:
  friendly_name : 'YamBMS'
  hostname: 'yambms'
  name: ''
  yambms_id: '1'              # <-- CAMBIADO: antes 'yambms1', ahora número solo
  yambms_name: 'YamBMS 1'
  yambms_update_interval: '1s'
  yambms_input_number_mode: 'slider'
  yambms_battery_chemistry: '1' # 1-LFP | 2-Li-ion | 3-LTO
  yambms_cell_count: '16'
  yambms_bulk_v: '55.2'
  yambms_float_v: '53.6'
  yambms_rebulk_v: '52.8'
  yambms_eoc_timer: '30'
  yambms_cutoff_timer: '60'
  yambms_max_requested_charge_current: '300'
  yambms_max_requested_discharge_current: '300'
  yambms_charging_rate_table: |
    {
      { -0.1, 0.00 },
      {  0.0, 0.05 },
      {  5.0, 0.12 },
      { 10.0, 0.30 },
      { 20.0, 0.50 },
      { 25.0, 0.50 },
      { 45.0, 0.50 },
      { 50.0, 0.50 },
      { 55.0, 0.50 },
      { 60.0, 0.00 }
    }
  yambms_discharging_rate_table: |
    {
      {-30.0, 0.00 },
      {-20.0, 0.50 },
      {-10.0, 0.50 },
      { -5.0, 0.50 },
      {  0.0, 0.50 },
      {  5.0, 0.50 },
      { 45.0, 0.50 },
      { 50.0, 0.50 },
      { 55.0, 0.50 },
      { 60.0, 0.00 }
    }
  shunt_update_interval: '3s'
  bms_update_interval: '3s'
  canbus_clock: 16MHz

packages:

  board:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: update-candidate-2026-08-17-soc-na-fix-v7
    refresh: 0min
    files:
      - path: 'packages/board/board_ESP32-S3_Freenove.yaml'

  board_options:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: update-candidate-2026-08-17-soc-na-fix-v7
    refresh: 0min
    files:
      - path: 'packages/board/board_options_itf_uart_esp_1.yaml'
      - path: 'packages/board/board_options_itf_canbus_mcp2515.yaml'
        vars:
          canbus_node_id: 'canbus_inverter_1'
          mcp2515_clock: '16MHz'   # <-- AÑADIDO: el conversor físico lleva un cristal de 16MHz,
                                    #     pero el paquete asume 8MHz por defecto si no se sobreescribe.
                                    #     Confirmado el 2026-08-18: la variable 'canbus_clock: 16MHz'
                                    #     del substitutions de arriba estaba huérfana (no la usa
                                    #     ningún paquete) - por eso nunca llegaba a aplicarse.

  bms:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: update-candidate-2026-08-17-soc-na-fix-v7
    refresh: 0min
    files:
      - path: 'packages/bms/bms_combine_JK_RS485_Modbus_sniffer.yaml'
        vars:
          sniffer_protocol: 'JK02_32S'
          sniffer_uart_id: 'uart_esp_1'
      - path: 'packages/bms/bms_combine_JK_RS485_Modbus_bms_full.yaml'
        vars:
          bms_id: '1'
          bms_name: 'JK-BMS 1'
          bms_address: '0x01'
      - path: 'packages/bms/bms_combine_JK_RS485_Modbus_bms_full.yaml'
        vars:
          bms_id: '2'
          bms_name: 'JK-BMS 2'
          bms_address: '0x02'

  yambms:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: update-candidate-2026-08-17-soc-na-fix-v7
    refresh: 0min
    files:
      - path: 'packages/yambms/yambms.yaml'

  canbus:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: update-candidate-2026-08-17-soc-na-fix-v7
    refresh: 0min
    files:
      - path: 'packages/yambms/yambms_canbus.yaml'
        vars:
          canbus_id: '1'              # <-- CAMBIADO: antes 'canbus1', ahora número solo
          canbus_name: 'CANBUS 1'
          canbus_node_id: 'canbus_inverter_1'
          canbus_light_id: 'esp_light'
          canbus_link_timer: '5s'

  debug:
    url: https://github.com/txubelaxu/esphome-yambms
    ref: update-candidate-2026-08-17-soc-na-fix-v7
    refresh: 0min
    files:
      - path: packages/base/device_debug_ESP32.yaml
        vars:
          debug_name: 'Debug'
          debug_update_interval: '5s'
          debug_psram_size: '8388608'
